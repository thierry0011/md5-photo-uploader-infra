name: Package nested-stack templates

# Triggers only on the SOURCE files, never on templates/root.packaged.yaml
# itself - that file is this workflow's own output, committed back to main
# below. Including it in `paths` would create push -> package -> commit ->
# push -> package -> ... forever.
on:
  push:
    branches: [main]
    paths:
      - "templates/root.yaml"
      - "templates/stacks/**"
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC federation to AWS
  contents: write   # required to commit the packaged template back to main

env:
  AWS_REGION: us-east-1
  # ARN output by bootstrap.yaml's InfraGitHubActionsRole.
  AWS_ROLE_ARN: arn:aws:iam::<AWS_ACCOUNT_ID>:role/photo-gallery-dev-github-actions-cfn-package
  # Bucket name output by bootstrap.yaml's TemplatesBucket.
  TEMPLATES_BUCKET: photo-gallery-dev-cfn-templates-<AWS_ACCOUNT_ID>

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package nested-stack templates to S3
        run: |
          aws cloudformation package \
            --template-file templates/root.yaml \
            --s3-bucket "$TEMPLATES_BUCKET" \
            --s3-prefix nested-stacks \
            --output-template-file templates/root.packaged.yaml

      - name: Commit packaged template if it changed
        run: |
          if git diff --quiet --exit-code -- templates/root.packaged.yaml; then
            echo "No changes to templates/root.packaged.yaml - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add templates/root.packaged.yaml
          git commit -m "chore: package nested-stack templates [skip ci]"
          git push
