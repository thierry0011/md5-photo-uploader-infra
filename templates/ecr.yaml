AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Photo Gallery - persistent ECR repository for the Django app image, plus
  GitHubActionsEcrPushRole (the app repo's CI push role - lives here, not
  in bootstrap.yaml, because it's only ever used by this template's
  RepositoryPolicyText; defining both in the same template lets
  CloudFormation resolve the dependency intra-stack instead of requiring a
  pasted-literal Parameter between two separately-deployed stacks).
  Outside root.yaml's nested-stack tree and untouched by teardown.sh: the
  one piece of state meant to survive a full teardown/respin, so the last
  working image never needs rebuilding. Deployed once via Git sync using
  InfraDeployRole (from bootstrap.yaml) - no new IAM needed.

  Uses its own dedicated CMK (EcrKmsKey), not the shared AppKmsKey from
  01-security.yaml: that key lives in SecurityStack, which teardown
  eventually destroys - reusing it would make every retained image
  unreadable, backwards for a resource meant to survive teardown.
  EcrKmsKey is Retain'd and skipped by teardown.sh and the KMS
  orphan-cleanup scan.

Parameters:
  ProjectName:
    Type: String
    Default: photo-gallery

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  GitHubOrg:
    Type: String
    Description: GitHub org or username that owns the app repo, e.g. "my-org".

  GitHubAppRepo:
    Type: String
    Default: md5-photo-uploader-app
    Description: Name of the application repository (a separate repo from the infra one).

  GitHubDeployBranch:
    Type: String
    Default: main
    Description: Branch allowed to assume the push role.

Resources:
  # Dedicated CMK (never shared with the ephemeral tree)
  EcrKmsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub Dedicated CMK for ${ProjectName}-${Environment} ECR (persists across respins, never shared with root.yaml's SecurityStack key)
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: RootAccountFullAccess
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: "kms:*"
            Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-ecr-cmk

  EcrKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${ProjectName}-${Environment}-ecr
      TargetKeyId: !Ref EcrKmsKey

  # GitHub Actions push role (co-located with the repo it's scoped to)
  GitHubActionsEcrPushRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-github-actions-ecr-push
      Description: Assumed by the app repo's GitHub Actions workflow via OIDC to build and push the app image to ECR.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}/${GitHubAppRepo}:ref:refs/heads/${GitHubDeployBranch}
                  - !Sub repo:${GitHubOrg}@*/${GitHubAppRepo}@*:ref:refs/heads/${GitHubDeployBranch}
      MaxSessionDuration: 3600
      Policies:
        - PolicyName: EcrPushAndAuth
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPushToAppRepo
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  # Resolves the digest ':latest' points to so taskdef.json can pin a fixed image
                  - ecr:DescribeImages
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}-${Environment}-app
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-github-actions-role

  # ECR repository (Retain - the actual point of this stack)
  AppRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub ${ProjectName}-${Environment}-app
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !GetAtt EcrKmsKey.Arn
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 1 day",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 1
                },
                "action": { "type": "expire" }
              }
            ]
          }
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowGitHubActionsPush
            Effect: Allow
            Principal:
              AWS: !GetAtt GitHubActionsEcrPushRole.Arn
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:PutImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-app-repo

Outputs:
  GitHubActionsRoleArn:
    Value: !GetAtt GitHubActionsEcrPushRole.Arn
    Description: >
      Put this in the app repo's GitHub Actions workflow as the
      role-to-assume (GitHub Secret). Also exported for root.yaml's
      09-cicd-pipeline.yaml to Fn::ImportValue instead of a pasted literal.
    Export:
      Name: !Sub ${ProjectName}-${Environment}-github-actions-role-arn

  RepositoryName:
    Value: !Ref AppRepository

  RepositoryArn:
    Value: !GetAtt AppRepository.Arn

  RepositoryUri:
    Value: !GetAtt AppRepository.RepositoryUri

  EcrKmsKeyArn:
    Value: !GetAtt EcrKmsKey.Arn
    # Exported for 07-ecs-alb.yaml's TaskExecutionRole to decrypt the Django secret SSM param, reusing this persistent key instead of an ephemeral one (avoids a first-deploy deadlock)
    Export:
      Name: !Sub ${ProjectName}-${Environment}-ecr-kms-key-arn
