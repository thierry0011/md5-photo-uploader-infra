AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Photo Gallery - persistent ECR repository for the Django app image.
  Outside root.yaml's nested-stack tree and untouched by teardown.sh: the
  one piece of state meant to survive a full teardown/respin, so the last
  working image never needs rebuilding. Deployed once via Git sync using
  InfraDeployRole (from bootstrap.yaml) - no new IAM needed.

  Uses its own dedicated CMK (EcrKmsKey), not the shared AppKmsKey from
  01-security.yaml: that key lives in SecurityStack, which teardown
  eventually destroys - reusing it would make every retained image
  unreadable, backwards for a resource meant to survive teardown.
  EcrKmsKey is Retain'd and skipped by teardown.sh and the KMS
  orphan-cleanup scan.

Parameters:
  ProjectName:
    Type: String
    Default: photo-gallery

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  GitHubActionsRoleArn:
    Type: String
    Description: >
      ARN of the GitHub Actions OIDC push role created by
      stacks/06-github-oidc.yaml (photo-gallery-<env>-github-actions-ecr-push).
      Passed as a literal value here rather than a cross-stack reference:
      that role's name is deterministic, so its ARN is stable across every
      root.yaml respin.

Resources:
  # ---------------- Dedicated CMK (never shared with the ephemeral tree) ----------------
  EcrKmsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub Dedicated CMK for ${ProjectName}-${Environment} ECR (persists across respins, never shared with root.yaml's SecurityStack key)
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: RootAccountFullAccess
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: "kms:*"
            Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-ecr-cmk

  EcrKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${ProjectName}-${Environment}-ecr
      TargetKeyId: !Ref EcrKmsKey

  # ---------------- ECR repository (Retain - the actual point of this stack) ----------------
  AppRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub ${ProjectName}-${Environment}-app
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !GetAtt EcrKmsKey.Arn
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 1 day",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 1
                },
                "action": { "type": "expire" }
              }
            ]
          }
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowGitHubActionsPush
            Effect: Allow
            Principal:
              AWS: !Ref GitHubActionsRoleArn
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:PutImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-app-repo

Outputs:
  RepositoryName:
    Value: !Ref AppRepository

  RepositoryArn:
    Value: !GetAtt AppRepository.Arn

  RepositoryUri:
    Value: !GetAtt AppRepository.RepositoryUri

  EcrKmsKeyArn:
    Value: !GetAtt EcrKmsKey.Arn
    # Exported so 07-ecs-alb.yaml's TaskExecutionRole (inside root.yaml,
    # a separate stack tree - see this template's Description) can grant
    # decrypt on it for the Django secret key SSM parameter, which
    # deliberately reuses this persistent key instead of root.yaml's own
    # ephemeral AppKmsKey. See that parameter's put-parameter command in
    # README.md for why: an ephemeral key would make root.yaml's very
    # first-ever deploy deadlock (ECS task can't resolve the secret before
    # SecurityStack has even created the key), and a value meant to survive
    # every teardown needs a key that also survives every teardown.
    Export:
      Name: !Sub ${ProjectName}-${Environment}-ecr-kms-key-arn
