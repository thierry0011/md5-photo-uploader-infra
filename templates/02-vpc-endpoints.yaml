AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Photo Gallery - Interface VPC endpoints so ECS tasks in private subnets can
  reach ECR, CloudWatch Logs and Secrets Manager without a NAT Gateway.

Parameters:
  ProjectName:
    Type: String
    Default: photo-gallery

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

Resources:
  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !ImportValue
        Fn::Sub: ${ProjectName}-${Environment}-VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.api
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-PrivateSubnet1Id
        - !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-PrivateSubnet2Id
      SecurityGroupIds:
        - !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-VpcEndpointsSecurityGroupId

  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !ImportValue
        Fn::Sub: ${ProjectName}-${Environment}-VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.dkr
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-PrivateSubnet1Id
        - !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-PrivateSubnet2Id
      SecurityGroupIds:
        - !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-VpcEndpointsSecurityGroupId

  CloudWatchLogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !ImportValue
        Fn::Sub: ${ProjectName}-${Environment}-VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.logs
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-PrivateSubnet1Id
        - !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-PrivateSubnet2Id
      SecurityGroupIds:
        - !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-VpcEndpointsSecurityGroupId

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !ImportValue
        Fn::Sub: ${ProjectName}-${Environment}-VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.secretsmanager
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-PrivateSubnet1Id
        - !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-PrivateSubnet2Id
      SecurityGroupIds:
        - !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-VpcEndpointsSecurityGroupId
