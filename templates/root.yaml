AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Photo Gallery - root nested-stack template. Owns 8 child stacks (network,
  security, vpc-endpoints, storage-cdn, database, ecs-alb, autoscaling,
  cicd-pipeline), wiring cross-stack values via !GetAtt. Single flat
  nesting since the dependency graph crosses too many boundaries for
  grouping to pay off.

  DEPLOYED BY: .github/workflows/deploy-root-stack.yml (packages to S3 +
  cloudformation deploy in one job; packaged template never committed).
  Not Git-sync.

  PREREQUISITES: bootstrap.yaml, then ecr.yaml, must already exist -
  neither is in this tree, and both survive every teardown/respin.
  EcrRepositoryArn is a plain Parameter; GitHubActionsRoleArn is resolved
  via Fn::ImportValue against ecr.yaml's export, since ecr.yaml owns that
  role. It moved out of this tree to break a real circular dependency:
  ecr.yaml needs the role first, and EcsAlbStack here needs ecr.yaml's
  KMS export.

Parameters:
  ProjectName:
    Type: String
    Default: photo-gallery

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  # ---- network ----
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16

  PublicSubnet1Cidr:
    Type: String
    Default: 10.20.0.0/24

  PublicSubnet2Cidr:
    Type: String
    Default: 10.20.1.0/24

  PrivateSubnet1Cidr:
    Type: String
    Default: 10.20.10.0/24

  PrivateSubnet2Cidr:
    Type: String
    Default: 10.20.11.0/24

  # ---- security / ecs-alb shared ----
  ContainerPort:
    Type: Number
    Default: 8000

  # ---- database ----
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro, db.t3.small, db.t3.medium]

  DBAllocatedStorage:
    Type: Number
    Default: 20

  DBEngineVersion:
    Type: String
    Default: "16.4"

  DBName:
    Type: String
    Default: photogallery

  DBMultiAZ:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

  DBDeletionProtection:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

  DBBackupRetentionDays:
    Type: Number
    Default: 7

  # ---- ecs-alb ----
  TaskCpu:
    Type: String
    Default: "512"
    AllowedValues: ["256", "512", "1024"]

  TaskMemory:
    Type: String
    Default: "1024"
    AllowedValues: ["512", "1024", "2048"]

  ContainerImage:
    Type: String
    Description: >
      Account-specific (own persistent ECR repo URI) - no sensible generic
      default, always supplied explicitly by deployments/root.yaml. See
      stacks/07-ecs-alb.yaml's ContainerImage Description for the full
      reasoning.

  DjangoAllowedHosts:
    Type: String
    Default: "*"

  # ---- autoscaling ----
  MinCapacity:
    Type: Number
    Default: 1

  MaxCapacity:
    Type: Number
    Default: 4

  CpuTargetValue:
    Type: Number
    Default: 60

  # ---- cicd-pipeline ----
  DeploymentTimeoutMinutes:
    Type: Number
    Default: 15

  # ---- ecr (persistent, deployed standalone via templates/ecr.yaml) ----
  # EcrRepositoryName isn't a Parameter here since 09-cicd-pipeline.yaml no longer triggers off ECR push events
  EcrRepositoryArn:
    Type: String
    Description: ECR repository ARN, output by the standalone templates/ecr.yaml stack.

Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stacks/00-network.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        VpcCidr: !Ref VpcCidr
        PublicSubnet1Cidr: !Ref PublicSubnet1Cidr
        PublicSubnet2Cidr: !Ref PublicSubnet2Cidr
        PrivateSubnet1Cidr: !Ref PrivateSubnet1Cidr
        PrivateSubnet2Cidr: !Ref PrivateSubnet2Cidr
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-network

  SecurityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stacks/01-security.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        ContainerPort: !Ref ContainerPort
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        VpcCidr: !GetAtt NetworkStack.Outputs.VpcCidr
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-security

  VpcEndpointsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stacks/02-vpc-endpoints.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PrivateSubnet1Id: !GetAtt NetworkStack.Outputs.PrivateSubnet1Id
        PrivateSubnet2Id: !GetAtt NetworkStack.Outputs.PrivateSubnet2Id
        VpcEndpointsSecurityGroupId: !GetAtt SecurityStack.Outputs.VpcEndpointsSecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-vpc-endpoints

  StorageCdnStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stacks/03-storage-cdn.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        AppKmsKeyArn: !GetAtt SecurityStack.Outputs.AppKmsKeyArn
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-storage-cdn

  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stacks/04-database.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        DBInstanceClass: !Ref DBInstanceClass
        DBAllocatedStorage: !Ref DBAllocatedStorage
        DBEngineVersion: !Ref DBEngineVersion
        DBName: !Ref DBName
        DBMultiAZ: !Ref DBMultiAZ
        DBDeletionProtection: !Ref DBDeletionProtection
        DBBackupRetentionDays: !Ref DBBackupRetentionDays
        PrivateSubnet1Id: !GetAtt NetworkStack.Outputs.PrivateSubnet1Id
        PrivateSubnet2Id: !GetAtt NetworkStack.Outputs.PrivateSubnet2Id
        AppKmsKeyId: !GetAtt SecurityStack.Outputs.AppKmsKeyId
        AppKmsKeyArn: !GetAtt SecurityStack.Outputs.AppKmsKeyArn
        RdsSecurityGroupId: !GetAtt SecurityStack.Outputs.RdsSecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-database

  EcsAlbStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stacks/07-ecs-alb.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        ContainerPort: !Ref ContainerPort
        TaskCpu: !Ref TaskCpu
        TaskMemory: !Ref TaskMemory
        ContainerImage: !Ref ContainerImage
        DjangoAllowedHosts: !Ref DjangoAllowedHosts
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PublicSubnet1Id: !GetAtt NetworkStack.Outputs.PublicSubnet1Id
        PublicSubnet2Id: !GetAtt NetworkStack.Outputs.PublicSubnet2Id
        PrivateSubnet1Id: !GetAtt NetworkStack.Outputs.PrivateSubnet1Id
        PrivateSubnet2Id: !GetAtt NetworkStack.Outputs.PrivateSubnet2Id
        AlbSecurityGroupId: !GetAtt SecurityStack.Outputs.AlbSecurityGroupId
        EcsSecurityGroupId: !GetAtt SecurityStack.Outputs.EcsSecurityGroupId
        AppKmsKeyArn: !GetAtt SecurityStack.Outputs.AppKmsKeyArn
        AccessLogsBucketName: !GetAtt StorageCdnStack.Outputs.AccessLogsBucketName
        ImagesBucketName: !GetAtt StorageCdnStack.Outputs.ImagesBucketName
        ImagesBucketArn: !GetAtt StorageCdnStack.Outputs.ImagesBucketArn
        CloudFrontDomainName: !GetAtt StorageCdnStack.Outputs.CloudFrontDomainName
        DBEndpointAddress: !GetAtt DatabaseStack.Outputs.DBInstanceEndpointAddress
        DBEndpointPort: !GetAtt DatabaseStack.Outputs.DBInstanceEndpointPort
        DBName: !GetAtt DatabaseStack.Outputs.DBName
        DBCredentialsSecretArn: !GetAtt DatabaseStack.Outputs.DBCredentialsSecretArn
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-ecs-alb

  AutoscalingStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stacks/08-autoscaling.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        MinCapacity: !Ref MinCapacity
        MaxCapacity: !Ref MaxCapacity
        CpuTargetValue: !Ref CpuTargetValue
        EcsClusterName: !GetAtt EcsAlbStack.Outputs.EcsClusterName
        EcsServiceName: !GetAtt EcsAlbStack.Outputs.EcsServiceName
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-autoscaling

  CicdPipelineStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stacks/09-cicd-pipeline.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        DeploymentTimeoutMinutes: !Ref DeploymentTimeoutMinutes
        AppKmsKeyArn: !GetAtt SecurityStack.Outputs.AppKmsKeyArn
        GitHubActionsRoleArn: !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-github-actions-role-arn
        AlbFullName: !GetAtt EcsAlbStack.Outputs.AlbFullName
        BlueTargetGroupFullName: !GetAtt EcsAlbStack.Outputs.BlueTargetGroupFullName
        GreenTargetGroupFullName: !GetAtt EcsAlbStack.Outputs.GreenTargetGroupFullName
        BlueTargetGroupName: !GetAtt EcsAlbStack.Outputs.BlueTargetGroupName
        GreenTargetGroupName: !GetAtt EcsAlbStack.Outputs.GreenTargetGroupName
        ProdListenerArn: !GetAtt EcsAlbStack.Outputs.ProdListenerArn
        EcsClusterName: !GetAtt EcsAlbStack.Outputs.EcsClusterName
        EcsServiceName: !GetAtt EcsAlbStack.Outputs.EcsServiceName
        TaskExecutionRoleArn: !GetAtt EcsAlbStack.Outputs.TaskExecutionRoleArn
        TaskRoleArn: !GetAtt EcsAlbStack.Outputs.TaskRoleArn
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-cicd-pipeline

Outputs:
  AlbDnsName:
    Value: !GetAtt EcsAlbStack.Outputs.AlbDnsName

  CloudFrontDomainName:
    Value: !GetAtt StorageCdnStack.Outputs.CloudFrontDomainName

  EcrRepositoryArn:
    Value: !Ref EcrRepositoryArn
    Description: >
      Same value passed in as a parameter - the repository itself lives in
      the standalone templates/ecr.yaml stack, not here.

  PipelineArtifactBucketName:
    Value: !GetAtt CicdPipelineStack.Outputs.PipelineArtifactBucketName
    Description: >
      The app repo's CI workflow looks this up live and uploads its
      rendered taskdef.json/appspec.yaml zip to s3://<this bucket>/source/appspec-taskdef.zip.
