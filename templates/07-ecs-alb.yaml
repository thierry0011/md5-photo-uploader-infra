AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Photo Gallery - Public ALB with two target groups + two listeners (blue/green
  for CodeDeploy), ECS Fargate cluster, task definition and service. The
  service's DeploymentController is CODE_DEPLOY: CodeDeploy owns traffic
  shifting between the two target groups, CloudFormation only owns the
  initial state.

Parameters:
  ProjectName:
    Type: String
    Default: photo-gallery

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  ContainerPort:
    Type: Number
    Default: 8000

  TestListenerPort:
    Type: Number
    Default: 8080

  TaskCpu:
    Type: String
    Default: "512"
    AllowedValues: ["256", "512", "1024"]

  TaskMemory:
    Type: String
    Default: "1024"
    AllowedValues: ["512", "1024", "2048"]

  ContainerImage:
    Type: String
    Default: public.ecr.aws/docker/library/httpd:2.4
    Description: >
      Bootstrap placeholder image so the ECS service can start before the
      first real application image exists. The CodeDeploy pipeline replaces
      this with the ECR app image on the first successful deployment.

  DjangoAllowedHosts:
    Type: String
    Default: "*"
    Description: Comma-separated ALLOWED_HOSTS for Django; tighten to the ALB DNS name after first deploy.

Resources:
  # ---------------- ALB ----------------
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-alb
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      SecurityGroups:
        - !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-AlbSecurityGroupId
      Subnets:
        - !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-PublicSubnet1Id
        - !ImportValue
          Fn::Sub: ${ProjectName}-${Environment}-PublicSubnet2Id
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "60"
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: access_logs.s3.enabled
          Value: "true"
        - Key: access_logs.s3.bucket
          Value: !ImportValue
            Fn::Sub: ${ProjectName}-${Environment}-AccessLogsBucketName
        - Key: access_logs.s3.prefix
          Value: alb
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-alb

  BlueTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-tg-blue
      TargetType: ip
      Protocol: HTTP
      Port: !Ref ContainerPort
      VpcId: !ImportValue
        Fn::Sub: ${ProjectName}-${Environment}-VpcId
      HealthCheckEnabled: true
      HealthCheckPath: /health/
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-tg-blue

  GreenTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-tg-green
      TargetType: ip
      Protocol: HTTP
      Port: !Ref ContainerPort
      VpcId: !ImportValue
        Fn::Sub: ${ProjectName}-${Environment}-VpcId
      HealthCheckEnabled: true
      HealthCheckPath: /health/
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-tg-green

  ProdListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BlueTargetGroup

  TestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: !Ref TestListenerPort
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref GreenTargetGroup

  DjangoSecretKey:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-django-secret-key
      Description: Django SECRET_KEY, generated once and injected into the task at runtime.
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: SECRET_KEY
        PasswordLength: 50
        ExcludePunctuation: true
      KmsKeyId: !ImportValue
        Fn::Sub: ${ProjectName}-${Environment}-AppKmsKeyId

  # ---------------- ECS ----------------
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${ProjectName}-${Environment}-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-cluster

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /ecs/${ProjectName}-${Environment}
      RetentionInDays: 30
      KmsKeyId: !ImportValue
        Fn::Sub: ${ProjectName}-${Environment}-AppKmsKeyArn

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-ecs-task-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadDbSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !ImportValue
                    Fn::Sub: ${ProjectName}-${Environment}-DBCredentialsSecretArn
                  - !Ref DjangoSecretKey
        - PolicyName: DecryptWithAppKey
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !ImportValue
                  Fn::Sub: ${ProjectName}-${Environment}-AppKmsKeyArn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-ecs-task-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ImagesBucketAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub
                  - ${BucketArn}/*
                  - BucketArn: !ImportValue
                      Fn::Sub: ${ProjectName}-${Environment}-ImagesBucketArn
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !ImportValue
                  Fn::Sub: ${ProjectName}-${Environment}-ImagesBucketArn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !ImportValue
                  Fn::Sub: ${ProjectName}-${Environment}-AppKmsKeyArn

  AppTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${ProjectName}-${Environment}-app
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: app
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: DJANGO_ALLOWED_HOSTS
              Value: !Ref DjangoAllowedHosts
            - Name: AWS_STORAGE_BUCKET_NAME
              Value: !ImportValue
                Fn::Sub: ${ProjectName}-${Environment}-ImagesBucketName
            - Name: AWS_CLOUDFRONT_DOMAIN
              Value: !ImportValue
                Fn::Sub: ${ProjectName}-${Environment}-CloudFrontDomainName
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: POSTGRES_HOST
              Value: !ImportValue
                Fn::Sub: ${ProjectName}-${Environment}-DBEndpointAddress
            - Name: POSTGRES_PORT
              Value: !ImportValue
                Fn::Sub: ${ProjectName}-${Environment}-DBEndpointPort
            - Name: POSTGRES_DB
              Value: !ImportValue
                Fn::Sub: ${ProjectName}-${Environment}-DBName
          Secrets:
            - Name: POSTGRES_USER
              ValueFrom: !Sub
                - "${SecretArn}:username::"
                - SecretArn: !ImportValue
                    Fn::Sub: ${ProjectName}-${Environment}-DBCredentialsSecretArn
            - Name: POSTGRES_PASSWORD
              ValueFrom: !Sub
                - "${SecretArn}:password::"
                - SecretArn: !ImportValue
                    Fn::Sub: ${ProjectName}-${Environment}-DBCredentialsSecretArn
            - Name: DJANGO_SECRET_KEY
              ValueFrom: !Sub "${DjangoSecretKey}:SECRET_KEY::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  AppService:
    Type: AWS::ECS::Service
    DependsOn: [ProdListener, TestListener]
    Properties:
      ServiceName: !Sub ${ProjectName}-${Environment}-service
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref AppTaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 60
      DeploymentController:
        Type: CODE_DEPLOY
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !ImportValue
              Fn::Sub: ${ProjectName}-${Environment}-PrivateSubnet1Id
            - !ImportValue
              Fn::Sub: ${ProjectName}-${Environment}-PrivateSubnet2Id
          SecurityGroups:
            - !ImportValue
              Fn::Sub: ${ProjectName}-${Environment}-EcsSecurityGroupId
      LoadBalancers:
        - ContainerName: app
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref BlueTargetGroup
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-service

Outputs:
  AlbDnsName:
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub ${ProjectName}-${Environment}-AlbDnsName

  AlbArn:
    Value: !Ref ApplicationLoadBalancer
    Export:
      Name: !Sub ${ProjectName}-${Environment}-AlbArn

  AlbFullName:
    Value: !GetAtt ApplicationLoadBalancer.LoadBalancerFullName
    Export:
      Name: !Sub ${ProjectName}-${Environment}-AlbFullName

  BlueTargetGroupFullName:
    Value: !GetAtt BlueTargetGroup.TargetGroupFullName
    Export:
      Name: !Sub ${ProjectName}-${Environment}-BlueTargetGroupFullName

  GreenTargetGroupFullName:
    Value: !GetAtt GreenTargetGroup.TargetGroupFullName
    Export:
      Name: !Sub ${ProjectName}-${Environment}-GreenTargetGroupFullName

  BlueTargetGroupArn:
    Value: !Ref BlueTargetGroup
    Export:
      Name: !Sub ${ProjectName}-${Environment}-BlueTargetGroupArn

  GreenTargetGroupArn:
    Value: !Ref GreenTargetGroup
    Export:
      Name: !Sub ${ProjectName}-${Environment}-GreenTargetGroupArn

  ProdListenerArn:
    Value: !Ref ProdListener
    Export:
      Name: !Sub ${ProjectName}-${Environment}-ProdListenerArn

  TestListenerArn:
    Value: !Ref TestListener
    Export:
      Name: !Sub ${ProjectName}-${Environment}-TestListenerArn

  BlueTargetGroupName:
    Value: !GetAtt BlueTargetGroup.TargetGroupName
    Export:
      Name: !Sub ${ProjectName}-${Environment}-BlueTargetGroupName

  GreenTargetGroupName:
    Value: !GetAtt GreenTargetGroup.TargetGroupName
    Export:
      Name: !Sub ${ProjectName}-${Environment}-GreenTargetGroupName

  EcsClusterName:
    Value: !Ref EcsCluster
    Export:
      Name: !Sub ${ProjectName}-${Environment}-EcsClusterName

  EcsClusterArn:
    Value: !GetAtt EcsCluster.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-EcsClusterArn

  EcsServiceName:
    Value: !GetAtt AppService.Name
    Export:
      Name: !Sub ${ProjectName}-${Environment}-EcsServiceName

  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-TaskExecutionRoleArn

  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}-TaskRoleArn

  AppLogGroupName:
    Value: !Ref AppLogGroup
    Export:
      Name: !Sub ${ProjectName}-${Environment}-AppLogGroupName
