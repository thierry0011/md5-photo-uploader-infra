AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Photo Gallery - Interface VPC endpoints so ECS tasks in private subnets
  reach ECR, CloudWatch Logs, Secrets Manager and Parameter Store without a
  NAT Gateway.
  Deliberately excludes an endpoint for public ECR (public.ecr.aws): the
  ecr-public.api PrivateLink endpoint only covers the control-plane API
  (PrivateDnsNames are api.ecr-public.<region>.amazonaws.com /
  ecr-public.<region>.api.aws), not the image-pull data path - there's no
  VPC-endpoint route to pull a public.ecr.aws image from a private subnet.

Parameters:
  ProjectName:
    Type: String
    Default: photo-gallery

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  VpcId:
    Type: String
    Description: VPC id from the network stack.

  PrivateSubnet1Id:
    Type: String
    Description: Private subnet 1 id from the network stack.

  PrivateSubnet2Id:
    Type: String
    Description: Private subnet 2 id from the network stack.

  VpcEndpointsSecurityGroupId:
    Type: String
    Description: Security group id for interface endpoints from the security stack.

Resources:
  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.api
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1Id
        - !Ref PrivateSubnet2Id
      SecurityGroupIds:
        - !Ref VpcEndpointsSecurityGroupId

  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.dkr
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1Id
        - !Ref PrivateSubnet2Id
      SecurityGroupIds:
        - !Ref VpcEndpointsSecurityGroupId

  CloudWatchLogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.logs
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1Id
        - !Ref PrivateSubnet2Id
      SecurityGroupIds:
        - !Ref VpcEndpointsSecurityGroupId

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.secretsmanager
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1Id
        - !Ref PrivateSubnet2Id
      SecurityGroupIds:
        - !Ref VpcEndpointsSecurityGroupId

  # Needed for the ECS agent to resolve the Django secret key via ssm:GetParameters from the private subnet
  SsmEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1Id
        - !Ref PrivateSubnet2Id
      SecurityGroupIds:
        - !Ref VpcEndpointsSecurityGroupId
