AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Photo Gallery - Public ALB with two target groups (blue/green for
  CodeDeploy) behind a single production listener, ECS Fargate cluster,
  task definition and service. The service's DeploymentController is
  CODE_DEPLOY: CodeDeploy owns traffic shifting between the two target
  groups, CloudFormation only owns the initial state.

  Deliberately no second (test) listener: a test listener only adds a
  pre-cutover manual-poke capability, and it did so by exposing the
  not-yet-live green fleet on a public port (0.0.0.0/0) before cutover.
  What actually gates traffic-shifting - both target groups' own health
  checks, polled continuously regardless of which listener (if any) points
  at them - stays exactly as rigorous either way, since CodeDeploy already
  waits for the new task set to pass its target group's health checks
  before shifting any production traffic to it. See
  stacks/09-cicd-pipeline.yaml's DeploymentGroup for where that's wired.

Parameters:
  ProjectName:
    Type: String
    Default: photo-gallery

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  ContainerPort:
    Type: Number
    Default: 8000

  TaskCpu:
    Type: String
    Default: "512"
    AllowedValues: ["256", "512", "1024"]

  TaskMemory:
    Type: String
    Default: "1024"
    AllowedValues: ["512", "1024", "2048"]

  ContainerImage:
    Type: String
    Description: >
      Image the ECS service starts on. Points at this account's own
      persistent ECR repo (templates/ecr.yaml), not the public httpd
      placeholder that used to live here as the default - that repo now
      survives every teardown/respin (see its Description), so once any
      real image has ever been pushed and tagged :latest, every future
      respin starts on it directly, no NAT Gateway needed for this pull.
      Only a genuinely first-ever cold start (repo just created, nothing
      pushed yet) needs a one-time manual seed - see HANDOFF.md.

  DjangoAllowedHosts:
    Type: String
    Default: "*"
    Description: Comma-separated ALLOWED_HOSTS for Django; tighten to the ALB DNS name after first deploy.

  VpcId:
    Type: String
    Description: VPC id from the network stack.

  PublicSubnet1Id:
    Type: String
    Description: Public subnet 1 id from the network stack.

  PublicSubnet2Id:
    Type: String
    Description: Public subnet 2 id from the network stack.

  PrivateSubnet1Id:
    Type: String
    Description: Private subnet 1 id from the network stack.

  PrivateSubnet2Id:
    Type: String
    Description: Private subnet 2 id from the network stack.

  AlbSecurityGroupId:
    Type: String
    Description: ALB security group id from the security stack.

  EcsSecurityGroupId:
    Type: String
    Description: ECS task security group id from the security stack.

  AppKmsKeyArn:
    Type: String
    Description: Shared CMK ARN from the security stack.

  AccessLogsBucketName:
    Type: String
    Description: ALB access-logs bucket name from the storage-cdn stack.

  ImagesBucketName:
    Type: String
    Description: Images bucket name from the storage-cdn stack.

  ImagesBucketArn:
    Type: String
    Description: Images bucket ARN from the storage-cdn stack.

  CloudFrontDomainName:
    Type: String
    Description: CloudFront domain name from the storage-cdn stack.

  DBEndpointAddress:
    Type: String
    Description: RDS endpoint address from the database stack.

  DBEndpointPort:
    Type: String
    Description: RDS endpoint port from the database stack.

  DBName:
    Type: String
    Description: Database name from the database stack.

  DBCredentialsSecretArn:
    Type: String
    Description: DB credentials secret ARN from the database stack.

Resources:
  # ---------------- ALB ----------------
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-alb
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref AlbSecurityGroupId
      Subnets:
        - !Ref PublicSubnet1Id
        - !Ref PublicSubnet2Id
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "60"
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: access_logs.s3.enabled
          Value: "true"
        - Key: access_logs.s3.bucket
          Value: !Ref AccessLogsBucketName
        - Key: access_logs.s3.prefix
          Value: alb
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-alb

  BlueTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-tg-blue
      TargetType: ip
      Protocol: HTTP
      Port: !Ref ContainerPort
      VpcId: !Ref VpcId
      HealthCheckEnabled: true
      HealthCheckPath: /health/
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-tg-blue

  GreenTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-tg-green
      TargetType: ip
      Protocol: HTTP
      Port: !Ref ContainerPort
      VpcId: !Ref VpcId
      HealthCheckEnabled: true
      HealthCheckPath: /health/
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-tg-green

  ProdListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BlueTargetGroup

  # ---------------- ECS ----------------
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${ProjectName}-${Environment}-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-cluster

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /ecs/${ProjectName}-${Environment}
      RetentionInDays: 30
      KmsKeyId: !Ref AppKmsKeyArn

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-ecs-task-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadDbSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DBCredentialsSecretArn
        - PolicyName: ReadDjangoSecretKeyParameter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow

                Action: ssm:GetParameters
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}-${Environment}-django-secret-key
              - Effect: Allow

                Action: kms:Decrypt
                Resource: !ImportValue
                  Fn::Sub: ${ProjectName}-${Environment}-ecr-kms-key-arn
        - PolicyName: DecryptWithAppKey
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Ref AppKmsKeyArn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-ecs-task-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ImagesBucketAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub ${ImagesBucketArn}/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Ref ImagesBucketArn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !Ref AppKmsKeyArn

  AppTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${ProjectName}-${Environment}-app
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: app
          Image: !Ref ContainerImage
          Essential: true
          Command:
            - "httpd-foreground"
            - "-C"
            - !Sub "Listen ${ContainerPort}"
            - "-C"
            - "Alias /health/ /usr/local/apache2/htdocs/index.html"
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: DJANGO_ALLOWED_HOSTS
              Value: !Ref DjangoAllowedHosts
            - Name: AWS_STORAGE_BUCKET_NAME
              Value: !Ref ImagesBucketName
            - Name: AWS_CLOUDFRONT_DOMAIN
              Value: !Ref CloudFrontDomainName
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: POSTGRES_HOST
              Value: !Ref DBEndpointAddress
            - Name: POSTGRES_PORT
              Value: !Ref DBEndpointPort
            - Name: POSTGRES_DB
              Value: !Ref DBName
          Secrets:
            - Name: POSTGRES_USER
              ValueFrom: !Sub "${DBCredentialsSecretArn}:username::"
            - Name: POSTGRES_PASSWORD
              ValueFrom: !Sub "${DBCredentialsSecretArn}:password::"
            - Name: DJANGO_SECRET_KEY
              # SecureString in Parameter Store, created once by hand

              ValueFrom: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}-${Environment}-django-secret-key
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  AppService:
    Type: AWS::ECS::Service
    DependsOn: [ProdListener]
    Properties:
      ServiceName: !Sub ${ProjectName}-${Environment}-service
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref AppTaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 60
      DeploymentController:
        Type: CODE_DEPLOY
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnet1Id
            - !Ref PrivateSubnet2Id
          SecurityGroups:
            - !Ref EcsSecurityGroupId
      LoadBalancers:
        - ContainerName: app
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref BlueTargetGroup
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-service

Outputs:
  AlbDnsName:
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  AlbArn:
    Value: !Ref ApplicationLoadBalancer

  AlbFullName:
    Value: !GetAtt ApplicationLoadBalancer.LoadBalancerFullName

  BlueTargetGroupFullName:
    Value: !GetAtt BlueTargetGroup.TargetGroupFullName

  GreenTargetGroupFullName:
    Value: !GetAtt GreenTargetGroup.TargetGroupFullName

  BlueTargetGroupArn:
    Value: !Ref BlueTargetGroup

  GreenTargetGroupArn:
    Value: !Ref GreenTargetGroup

  ProdListenerArn:
    Value: !Ref ProdListener

  BlueTargetGroupName:
    Value: !GetAtt BlueTargetGroup.TargetGroupName

  GreenTargetGroupName:
    Value: !GetAtt GreenTargetGroup.TargetGroupName

  EcsClusterName:
    Value: !Ref EcsCluster

  EcsClusterArn:
    Value: !GetAtt EcsCluster.Arn

  EcsServiceName:
    Value: !GetAtt AppService.Name

  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn

  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn

  AppLogGroupName:
    Value: !Ref AppLogGroup
