AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Photo Gallery - RDS PostgreSQL (db.t3 family) in its own dedicated private
  subnets (separate tier from ECS), credentials in Secrets Manager, encrypted
  with the shared CMK.

Parameters:
  ProjectName:
    Type: String
    Default: photo-gallery

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro, db.t3.small, db.t3.medium]

  DBAllocatedStorage:
    Type: Number
    Default: 20

  DBEngineVersion:
    Type: String
    Default: "16.4"

  DBName:
    Type: String
    Default: photogallery

  DBMultiAZ:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Multi-AZ RDS failover roughly doubles cost; on by default.

  DBDeletionProtection:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

  DBBackupRetentionDays:
    Type: Number
    Default: 7

  PrivateDbSubnet1Id:
    Type: String
    Description: Dedicated RDS private subnet 1 id from the network stack.

  PrivateDbSubnet2Id:
    Type: String
    Description: Dedicated RDS private subnet 2 id from the network stack.

  AppKmsKeyId:
    Type: String
    Description: Shared CMK key id from the security stack.

  AppKmsKeyArn:
    Type: String
    Description: Shared CMK ARN from the security stack.

  RdsSecurityGroupId:
    Type: String
    Description: RDS security group id from the security stack.

Conditions:
  IsMultiAZ: !Equals [!Ref DBMultiAZ, "true"]

Resources:
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub Dedicated private subnets for ${ProjectName}-${Environment} RDS
      SubnetIds:
        - !Ref PrivateDbSubnet1Id
        - !Ref PrivateDbSubnet2Id
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-db-subnet-group

  DBCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-db-credentials
      Description: RDS PostgreSQL master credentials for the photo gallery app
      GenerateSecretString:
        SecretStringTemplate: '{"username": "photogalleryadmin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: "\"@/\\ '"
      KmsKeyId: !Ref AppKmsKeyId
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-db-credentials

  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub ${ProjectName}-${Environment}-db
      Engine: postgres
      EngineVersion: !Ref DBEngineVersion
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      KmsKeyId: !Ref AppKmsKeyArn
      DBName: !Ref DBName
      MasterUsername: !Sub "{{resolve:secretsmanager:${DBCredentialsSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DBCredentialsSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RdsSecurityGroupId
      MultiAZ: !If [IsMultiAZ, true, false]
      PubliclyAccessible: false
      BackupRetentionPeriod: !Ref DBBackupRetentionDays
      DeletionProtection: !Ref DBDeletionProtection
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      EnablePerformanceInsights: true
      PerformanceInsightsKMSKeyId: !Ref AppKmsKeyArn
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-db

  DBSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DBCredentialsSecret
      TargetId: !Ref DBInstance
      TargetType: AWS::RDS::DBInstance

  # Stable parameter name the app repo reads, since the RDS endpoint changes whenever the instance is recreated
  DBEndpointAddressParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-db-endpoint-address
      Type: String
      Value: !GetAtt DBInstance.Endpoint.Address
      Description: RDS endpoint address, read by the app repo's ECS task at container launch.

Outputs:
  DBInstanceEndpointAddress:
    Value: !GetAtt DBInstance.Endpoint.Address

  DBInstanceEndpointPort:
    Value: !GetAtt DBInstance.Endpoint.Port

  DBName:
    Value: !Ref DBName

  DBCredentialsSecretArn:
    Value: !Ref DBCredentialsSecret
