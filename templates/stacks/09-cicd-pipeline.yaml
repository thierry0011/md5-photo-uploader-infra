AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Photo Gallery - Blue/green deployment pipeline. EventBridge fires on
  every ECR push of the app image and starts CodePipeline. The pipeline
  has two Source actions: an ECR source action that resolves the pushed
  image's digest natively (imageDetail.json), and an S3 source action
  reading a static taskdef.json/appspec.yaml template (containing a literal
  "<IMAGE1_NAME>" placeholder in the image field) that the app repo's CI
  uploads via its own GitHub OIDC role - CodePipeline never talks to GitHub
  directly. The CodeDeployToECS deploy action substitutes the placeholder
  with the resolved digest itself (Image1ArtifactName/Image1ContainerName),
  so no CI-side digest resolution or task-def rendering is needed. The app
  repo's workflow uploads the template *before* pushing the image, so the
  template is always already in place by the time the ECR-push trigger
  fires CodePipeline. Deploy is an ECS blue/green shift between the two ALB
  target groups (single prod listener - see 07-ecs-alb.yaml).

Parameters:
  ProjectName:
    Type: String
    Default: photo-gallery

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  DeploymentTimeoutMinutes:
    Type: Number
    Default: 15
    Description: Minutes CodeDeploy waits for the old (blue) task set to be terminated after traffic shifts.

  AppKmsKeyArn:
    Type: String
    Description: Shared CMK ARN from the security stack.

  GitHubActionsRoleArn:
    Type: String
    Description: >
      GitHub Actions role ARN from the github-oidc stack. Granted write
      access to this stack's S3 artifact bucket (deploy-artifact prefix
      only) and decrypt/encrypt on AppKmsKeyArn, so the app repo's CI can
      upload the taskdef.json/appspec.yaml template without CodePipeline
      ever reading from GitHub directly.

  EcrRepositoryName:
    Type: String
    Description: >
      App image repository name, imported from templates/ecr.yaml. Used by
      the pipeline's ECR source action and the EventBridge rule that
      triggers CodePipeline on push.

  EcrRepositoryArn:
    Type: String
    Description: ECR repository ARN, for scoping CodePipelineServiceRole's ecr:DescribeImages.

  AlbFullName:
    Type: String
    Description: ALB full name from the ecs-alb stack.

  BlueTargetGroupFullName:
    Type: String
    Description: Blue target group full name from the ecs-alb stack.

  GreenTargetGroupFullName:
    Type: String
    Description: Green target group full name from the ecs-alb stack.

  BlueTargetGroupName:
    Type: String
    Description: Blue target group name from the ecs-alb stack.

  GreenTargetGroupName:
    Type: String
    Description: Green target group name from the ecs-alb stack.

  ProdListenerArn:
    Type: String
    Description: Production listener ARN from the ecs-alb stack.

  EcsClusterName:
    Type: String
    Description: ECS cluster name from the ecs-alb stack.

  EcsServiceName:
    Type: String
    Description: ECS service name from the ecs-alb stack.

  TaskExecutionRoleArn:
    Type: String
    Description: ECS task execution role ARN from the ecs-alb stack.

  TaskRoleArn:
    Type: String
    Description: ECS task role ARN from the ecs-alb stack.

Resources:
  # ---------------- Artifact bucket (deploy artifact source + pipeline artifact store) ----------------
  PipelineArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${ProjectName}-${Environment}-pipeline-artifacts-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref AppKmsKeyArn
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7

  # Grants the app repo's CI role write access to just the deploy-artifact prefix
  PipelineArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PipelineArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAppRepoCiUploadDeployArtifact
            Effect: Allow
            Principal:
              AWS: !Ref GitHubActionsRoleArn
            Action: s3:PutObject
            Resource: !Sub ${PipelineArtifactBucket.Arn}/source/*
 
  GitHubActionsArtifactUploadKmsPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${ProjectName}-${Environment}-github-actions-artifact-kms
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EncryptDeployArtifact
            Effect: Allow
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
            Resource: !Ref AppKmsKeyArn
      Roles:
        - !Select [1, !Split ["/", !Ref GitHubActionsRoleArn]]

  # ---------------- CodeDeploy (ECS blue/green) ----------------
  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-codedeploy-ecs
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS

  BlueTargetGroupUnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${Environment}-blue-tg-unhealthy
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: TargetGroup
          Value: !Ref BlueTargetGroupFullName
        - Name: LoadBalancer
          Value: !Ref AlbFullName

  GreenTargetGroupUnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${Environment}-green-tg-unhealthy
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: TargetGroup
          Value: !Ref GreenTargetGroupFullName
        - Name: LoadBalancer
          Value: !Ref AlbFullName

  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub ${ProjectName}-${Environment}-app
      ComputePlatform: ECS

  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub ${ProjectName}-${Environment}-dg
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE
          - DEPLOYMENT_STOP_ON_ALARM
      AlarmConfiguration:
        Enabled: true
        Alarms:
          - Name: !Ref BlueTargetGroupUnhealthyAlarm
          - Name: !Ref GreenTargetGroupUnhealthyAlarm
      BlueGreenDeploymentConfiguration:
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: !Ref DeploymentTimeoutMinutes
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      ECSServices:
        - ClusterName: !Ref EcsClusterName
          ServiceName: !Ref EcsServiceName
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - ProdTrafficRoute:
              ListenerArns:
                - !Ref ProdListenerArn
            TargetGroups:
              - Name: !Ref BlueTargetGroupName
              - Name: !Ref GreenTargetGroupName

  # ---------------- CodePipeline ----------------
  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-codepipeline
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelinePermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ArtifactBucketAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketVersioning
                Resource:
                  - !GetAtt PipelineArtifactBucket.Arn
                  - !Sub ${PipelineArtifactBucket.Arn}/*
              - Sid: KmsForArtifacts
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !Ref AppKmsKeyArn
              - Sid: EcrSourceAction
                Effect: Allow
                Action: ecr:DescribeImages
                Resource: !Ref EcrRepositoryArn
              - Sid: CodeDeployDrive
                Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetApplication
                  - codedeploy:GetApplicationRevision
                  - codedeploy:GetDeployment
                  - codedeploy:GetDeploymentConfig
                  - codedeploy:RegisterApplicationRevision
                Resource: "*"
              - Sid: EcsAndPassRole
                Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                Resource: "*"
              - Sid: PassEcsRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Ref TaskExecutionRoleArn
                  - !Ref TaskRoleArn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

  AppPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-pipeline
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineArtifactBucket
        EncryptionKey:
          Type: KMS
          Id: !Ref AppKmsKeyArn
      Stages:
        - Name: Source
          Actions:
            # Static template (taskdef.json has a literal "<IMAGE1_NAME>" placeholder) - uploaded before every image push, see build-and-push.yml
            - Name: TaskDefTemplateSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: S3
                Version: "1"
              Configuration:
                S3Bucket: !Ref PipelineArtifactBucket
                S3ObjectKey: source/appspec-taskdef.zip
                PollForSourceChanges: "false"
              OutputArtifacts:
                - Name: TemplateArtifactOutput
              RunOrder: 1
            # Resolves the digest of the image that was just pushed (this is what the EventBridge rule below fires on)
            - Name: ImageSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: ECR
                Version: "1"
              Configuration:
                RepositoryName: !Ref EcrRepositoryName
                ImageTag: latest
              OutputArtifacts:
                - Name: ImageDetailOutput
              RunOrder: 1
        - Name: Deploy
          Actions:
            - Name: DeployToECS
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: "1"
              InputArtifacts:
                - Name: TemplateArtifactOutput
                - Name: ImageDetailOutput
              Configuration:
                ApplicationName: !Ref CodeDeployApplication
                DeploymentGroupName: !Ref CodeDeployDeploymentGroup
                TaskDefinitionTemplateArtifact: TemplateArtifactOutput
                TaskDefinitionTemplatePath: taskdef.json
                AppSpecTemplateArtifact: TemplateArtifactOutput
                AppSpecTemplatePath: appspec.yaml
                Image1ArtifactName: ImageDetailOutput
                Image1ContainerName: IMAGE1_NAME
              RunOrder: 1

  # ---------------- EventBridge: ECR image push -> start pipeline ----------------
  EventBridgeInvokePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-eventbridge-pipeline
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartPipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Sub arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${AppPipeline}

  EcrImagePushRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-ecr-image-push
      Description: Starts the deployment pipeline whenever the app repo's CI pushes a new ":latest" image to ECR.
      EventPattern:
        source: [aws.ecr]
        detail-type: ["ECR Image Action"]
        detail:
          action-type: ["PUSH"]
          repository-name: [!Ref EcrRepositoryName]
          image-tag: ["latest"]
          result: ["SUCCESS"]
      State: ENABLED
      Targets:
        - Id: StartCodePipeline
          Arn: !Sub arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${AppPipeline}
          RoleArn: !GetAtt EventBridgeInvokePipelineRole.Arn

Outputs:
  PipelineArtifactBucketName:
    Value: !Ref PipelineArtifactBucket

  PipelineArtifactBucketArn:
    Value: !GetAtt PipelineArtifactBucket.Arn

  PipelineName:
    Value: !Ref AppPipeline

  CodeDeployApplicationName:
    Value: !Ref CodeDeployApplication

  CodeDeployDeploymentGroupName:
    Value: !Ref CodeDeployDeploymentGroup
