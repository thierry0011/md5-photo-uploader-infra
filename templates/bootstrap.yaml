AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Photo Gallery - one-time bootstrap prerequisite. Not part of the
  nested-stack tree, deployed standalone and first. Creates the S3 bucket
  CI packages nested-stack templates into, and InfraDeployRole (assumed by
  the infra repo's GitHub Actions workflow via OIDC, and by CloudFormation
  itself as execution role for every nested-stack resource). Depends on
  nothing created later, by design.

  GitHubActionsEcrPushRole (the app repo's CI push role) now lives in
  templates/ecr.yaml instead of here - it's only ever used by that
  template's RepositoryPolicyText, and defining it in the same template
  lets CloudFormation resolve the intra-stack dependency itself instead of
  requiring a pasted-literal Parameter between two separately-deployed
  stacks (see ecr.yaml's Description for the circular-dependency reasoning
  that keeps it out of root.yaml specifically).

Parameters:
  ProjectName:
    Type: String
    Default: photo-gallery

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  GitHubOrg:
    Type: String
    Description: GitHub org or username that owns the infra repo, e.g. "my-org".

  GitHubInfraRepo:
    Type: String
    Default: md5-photo-uploader-infra
    Description: Name of this infrastructure repository.

  GitHubDeployBranch:
    Type: String
    Default: main
    Description: Branch allowed to assume the deploy role.

  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Set to "false" if a token.actions.githubusercontent.com OIDC provider
      already exists in this AWS account (an account can only have one).

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  TemplatesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${ProjectName}-${Environment}-cfn-templates-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-cfn-templates

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  InfraDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-github-actions-cfn-deploy
      Description: >
        Assumed by the infra repo's GitHub Actions workflow via OIDC to
        package and deploy the nested stack, and by CloudFormation as the
        execution role while it provisions the resources declared in it.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: GitHubActionsOidc
            Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}/${GitHubInfraRepo}:ref:refs/heads/${GitHubDeployBranch}
                  - !Sub repo:${GitHubOrg}@*/${GitHubInfraRepo}@*:ref:refs/heads/${GitHubDeployBranch}
          - Sid: CloudFormationServiceExecution
            Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      MaxSessionDuration: 3600
      Policies:
        - PolicyName: DeployNestedStack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Packaging: upload/read child templates in S3
              - Sid: TemplatesBucketAccess
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub ${TemplatesBucket.Arn}/*
              - Sid: TemplatesBucketList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt TemplatesBucket.Arn

              # CloudFormation: root stack + its 9 nested children (one wildcard covers both via name prefixing)
              - Sid: CloudFormationStackOperations
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-${Environment}-*/*

              # 00-network.yaml: EC2 networking; most actions lack resource-level ARNs, hence Resource: "*"
              - Sid: NetworkEc2
                Effect: Allow
                Action:
                  - ec2:DescribeAvailabilityZones
                  - ec2:CreateVpc
                  - ec2:DeleteVpc
                  - ec2:DescribeVpcs
                  - ec2:ModifyVpcAttribute
                  - ec2:CreateSubnet
                  - ec2:DeleteSubnet
                  - ec2:DescribeSubnets
                  - ec2:ModifySubnetAttribute
                  - ec2:CreateInternetGateway
                  - ec2:DeleteInternetGateway
                  - ec2:AttachInternetGateway
                  - ec2:DetachInternetGateway
                  - ec2:DescribeInternetGateways
                  - ec2:CreateRouteTable
                  - ec2:DeleteRouteTable
                  - ec2:CreateRoute
                  - ec2:DeleteRoute
                  - ec2:AssociateRouteTable
                  - ec2:DisassociateRouteTable
                  - ec2:ReplaceRouteTableAssociation
                  - ec2:DescribeRouteTables
                  - ec2:CreateVpcEndpoint
                  - ec2:DeleteVpcEndpoints
                  - ec2:ModifyVpcEndpoint
                  - ec2:DescribeVpcEndpoints
                  - ec2:DescribeVpcEndpointServices
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - ec2:DescribeTags
                Resource: "*"

              # Covers both 01-security.yaml's CMK and ecr.yaml's EcrKmsKey (same role), no per-key scoping needed
              - Sid: SecurityKms
                Effect: Allow
                Action:
                  - kms:CreateKey
                  - kms:DescribeKey
                  - kms:EnableKeyRotation
                  - kms:PutKeyPolicy
                  - kms:GetKeyPolicy
                  - kms:ScheduleKeyDeletion
                  - kms:CancelKeyDeletion
                  - kms:TagResource
                  - kms:UntagResource
                  - kms:ListResourceTags
                  - kms:CreateAlias
                  - kms:DeleteAlias
                  - kms:UpdateAlias
                  - kms:ListAliases
                  # Also needed by other services to use this key (e.g. kms:CreateGrant for ECR), not just to manage it
                  - kms:CreateGrant
                  - kms:RevokeGrant
                  - kms:ListGrants
                  - kms:GenerateDataKey
                  - kms:GenerateDataKeyWithoutPlaintext
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:ReEncryptFrom
                  - kms:ReEncryptTo
                Resource: "*"
              - Sid: SecurityGroups
                Effect: Allow
                Action:
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:DescribeSecurityGroups
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                Resource: "*"

              # 03-storage-cdn.yaml: S3 image/logs buckets + CloudFront
              - Sid: StorageCdnBuckets
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketVersioning
                  - s3:PutEncryptionConfiguration
                  - s3:GetEncryptionConfiguration
                  - s3:PutBucketLogging
                  - s3:PutLifecycleConfiguration
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:GetBucketPolicy
                  - s3:PutBucketOwnershipControls
                  - s3:PutBucketAcl
                  - s3:GetBucketAcl
                  - s3:PutBucketTagging
                  - s3:GetBucketTagging
                  # Needed for PipelineArtifactBucket's EventBridgeConfiguration in 09-cicd-pipeline.yaml
                  - s3:PutBucketNotification
                  - s3:GetBucketNotification
                  # CreateBucket with inline Tags checks s3:TagResource, distinct from s3:PutBucketTagging
                  - s3:TagResource
                  - s3:UntagResource
                  - s3:ListTagsForResource
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Sub arn:aws:s3:::${ProjectName}-*
              - Sid: CloudFrontDistribution
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:CreateResponseHeadersPolicy
                  - cloudfront:DeleteResponseHeadersPolicy
                  - cloudfront:GetResponseHeadersPolicy
                  - cloudfront:UpdateResponseHeadersPolicy
                Resource: "*"

              # 04-database.yaml: RDS + Secrets Manager
              - Sid: DatabaseRds
                Effect: Allow
                Action:
                  - rds:CreateDBSubnetGroup
                  - rds:DeleteDBSubnetGroup
                  - rds:ModifyDBSubnetGroup
                  - rds:DescribeDBSubnetGroups
                  - rds:CreateDBInstance
                  - rds:DeleteDBInstance
                  - rds:ModifyDBInstance
                  - rds:DescribeDBInstances
                  - rds:AddTagsToResource
                  - rds:RemoveTagsFromResource
                  - rds:ListTagsForResource
                  # DBInstance's DeletionPolicy: Snapshot requires rds:CreateDBSnapshot on delete/rollback
                  - rds:CreateDBSnapshot
                  - rds:DescribeDBSnapshots
                Resource: "*"
              - Sid: DatabaseSecrets
                Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:UpdateSecret
                  - secretsmanager:TagResource
                  - secretsmanager:UntagResource
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}-*
              # GetRandomPassword isn't resource-level, needs "*"; Django secret key is a separate hand-created SSM param
              - Sid: SecretsManagerGetRandomPassword
                Effect: Allow
                Action: secretsmanager:GetRandomPassword
                Resource: "*"

              # 03-storage-cdn.yaml / 04-database.yaml: SSM params publishing CloudFront domain and DB endpoint for the ECS task
              - Sid: SsmParametersForApp
                Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                  - ssm:GetParameters
                  - ssm:AddTagsToResource
                  - ssm:RemoveTagsFromResource
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}-${Environment}-*

              # templates/ecr.yaml's ECR repo, deployed standalone; scoped by name pattern so it's covered too
              - Sid: EcrRepository
                Effect: Allow
                Action:
                  - ecr:CreateRepository
                  - ecr:DeleteRepository
                  - ecr:DescribeRepositories
                  - ecr:PutLifecyclePolicy
                  - ecr:DeleteLifecyclePolicy
                  - ecr:PutImageScanningConfiguration
                  - ecr:SetRepositoryPolicy
                  - ecr:DeleteRepositoryPolicy
                  - ecr:GetRepositoryPolicy
                  - ecr:TagResource
                  - ecr:UntagResource
                  - ecr:ListTagsForResource
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}-*

              # IAM roles created by the nested stacks (07, 08, 09)
              - Sid: IamRolesForStacks
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-*
              # PassRole scoped by iam:PassedToService per consuming service, not a blanket "*"
              - Sid: PassRolesToServices
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-*
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      # cloudformation.amazonaws.com: role passes itself, needed for deploy --role-arn
                      - cloudformation.amazonaws.com
                      - ecs-tasks.amazonaws.com
                      - application-autoscaling.amazonaws.com
                      - codepipeline.amazonaws.com
                      - codedeploy.amazonaws.com
                      - events.amazonaws.com

              # 07-ecs-alb.yaml: ALB, ECS, CloudWatch Logs
              - Sid: EcsAlb
                Effect: Allow
                Action:
                  - elasticloadbalancing:CreateLoadBalancer
                  - elasticloadbalancing:DeleteLoadBalancer
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:ModifyLoadBalancerAttributes
                  - elasticloadbalancing:DescribeLoadBalancerAttributes
                  - elasticloadbalancing:CreateTargetGroup
                  - elasticloadbalancing:DeleteTargetGroup
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:ModifyTargetGroup
                  - elasticloadbalancing:ModifyTargetGroupAttributes
                  - elasticloadbalancing:DescribeTargetGroupAttributes
                  # Needed to resolve !GetAtt TargetGroup.TargetGroupFullName, used in Outputs and 09's alarm dimensions
                  - elasticloadbalancing:DescribeTargetHealth
                  - elasticloadbalancing:CreateListener
                  - elasticloadbalancing:DeleteListener
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:ModifyListener
                  - elasticloadbalancing:AddTags
                  - elasticloadbalancing:RemoveTags
                  - elasticloadbalancing:DescribeTags
                  - ecs:CreateCluster
                  - ecs:DeleteCluster
                  - ecs:DescribeClusters
                  - ecs:PutClusterCapacityProviders
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                  - ecs:CreateService
                  - ecs:UpdateService
                  - ecs:DeleteService
                  - ecs:DescribeServices
                  - ecs:TagResource
                  - ecs:UntagResource
                Resource: "*"
              - Sid: EcsAlbLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:PutRetentionPolicy
                  - logs:AssociateKmsKey
                  - logs:TagResource
                  - logs:TagLogGroup
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${ProjectName}-*

              # 08-autoscaling.yaml: Application Auto Scaling
              - Sid: Autoscaling
                Effect: Allow
                Action:
                  - application-autoscaling:RegisterScalableTarget
                  - application-autoscaling:DeregisterScalableTarget
                  - application-autoscaling:DescribeScalableTargets
                  - application-autoscaling:PutScalingPolicy
                  - application-autoscaling:DeleteScalingPolicy
                  - application-autoscaling:DescribeScalingPolicies
                Resource: "*"
              # First ScalableTarget in the account auto-creates this service-linked role
              - Sid: EcsAutoscalingServiceLinkedRole
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService
                Condition:
                  StringEquals:
                    iam:AWSServiceName: ecs.application-autoscaling.amazonaws.com

              # 07-ecs-alb.yaml: first load-balanced ECS service auto-creates this service-linked role too
              - Sid: EcsServiceLinkedRole
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.amazonaws.com/AWSServiceRoleForECS
                Condition:
                  StringEquals:
                    iam:AWSServiceName: ecs.amazonaws.com

              # 09-cicd-pipeline.yaml: CodeStar Connections, CodePipeline, CodeDeploy, EventBridge, CloudWatch alarms
              - Sid: CicdPipeline
                Effect: Allow
                Action:
                  - codestar-connections:CreateConnection
                  - codestar-connections:DeleteConnection
                  - codestar-connections:GetConnection
                  - codestar-connections:TagResource
                  # Same shape as iam:PassRole - required to hand the connection to CodePipeline
                  - codestar-connections:PassConnection
                  - codepipeline:CreatePipeline
                  - codepipeline:DeletePipeline
                  - codepipeline:GetPipeline
                  - codepipeline:UpdatePipeline
                  - codepipeline:TagResource
                  - codedeploy:CreateApplication
                  - codedeploy:DeleteApplication
                  - codedeploy:GetApplication
                  - codedeploy:CreateDeploymentGroup
                  - codedeploy:DeleteDeploymentGroup
                  - codedeploy:GetDeploymentGroup
                  - codedeploy:UpdateDeploymentGroup
                  - codedeploy:TagResource
                  - events:PutRule
                  - events:DeleteRule
                  - events:DescribeRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:TagResource
                Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${Environment}-github-actions-cfn-deploy

Outputs:
  TemplatesBucketName:
    Value: !Ref TemplatesBucket
    Description: Pass to `aws cloudformation package --s3-bucket`.

  InfraDeployRoleArn:
    Value: !GetAtt InfraDeployRole.Arn
    Description: >
      Put this in .github/workflows/*.yml as the role-to-assume, and pass it
      to `aws cloudformation deploy --role-arn` too.
