
parameters:
  ProjectName: photo-gallery
  Environment: dev
  VpcCidr: "10.20.0.0/16"
  PublicSubnet1Cidr: "10.20.0.0/24"
  PublicSubnet2Cidr: "10.20.1.0/24"
  PrivateSubnet1Cidr: "10.20.10.0/24"
  PrivateSubnet2Cidr: "10.20.11.0/24"
  EnableNatGateway: "false"
  ContainerPort: "8000"
  DBInstanceClass: db.t3.micro
  DBAllocatedStorage: "20"
  DBEngineVersion: "16.4"
  DBName: photogallery
  DBMultiAZ: "true"
  DBDeletionProtection: "false"
  DBBackupRetentionDays: "7"
  GitHubOrg: "thierry0011"
  GitHubAppRepo: "md5-photo-uploader-app"
  GitHubDeployBranch: "main"
  # bootstrap.yaml already created the account's OIDC provider - this stack
  # must not try to create a second one.
  CreateOidcProvider: "false"
  TaskCpu: "512"
  TaskMemory: "1024"
  # Own persistent repo (templates/ecr.yaml), not the public httpd
  # placeholder - see stacks/07-ecs-alb.yaml's ContainerImage Description.
  # Requires a one-time manual seed if :latest doesn't exist yet - see
  # HANDOFF.md.
  ContainerImage: "711387109786.dkr.ecr.us-east-1.amazonaws.com/photo-gallery-dev-app:latest"
  DjangoAllowedHosts: "*"
  MinCapacity: "1"
  MaxCapacity: "4"
  CpuTargetValue: "60"
  DeploymentTimeoutMinutes: "15"
  # Output by the standalone templates/ecr.yaml stack (deployed once via Git
  # sync, never touched by teardown). Both are deterministic - the repo name
  # pattern and standard ECR ARN format - so these are safe to hardcode.
  EcrRepositoryName: "photo-gallery-dev-app"
  EcrRepositoryArn: "arn:aws:ecr:us-east-1:711387109786:repository/photo-gallery-dev-app"
tags:
  Project: photo-gallery
  Environment: dev
  ManagedBy: GitHubActions-Deploy
